<!-- Squash the Bugs' picture on the games page: a bug climbing out of a pipe, in the game's own colors -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 25" shape-rendering="crispEdges">
    <rect width="25" height="25" fill="#6b8cff"/>

    <!-- A cloud -->
    <g fill="#fff">
        <rect x="2" y="3" width="5" height="1"/>
        <rect x="1" y="4" width="8" height="1"/>
        <rect x="19" y="6" width="3" height="1"/>
        <rect x="18" y="7" width="6" height="1"/>
    </g>

    <!-- The bug (same pixels as BUG_PIXELS in resources/js/bug-squash.js) -->
    <g fill="#8d3fd8">
        <rect x="10" y="4" width="1" height="1"/><rect x="14" y="4" width="1" height="1"/>
        <rect x="11" y="5" width="1" height="1"/><rect x="13" y="5" width="1" height="1"/>
        <rect x="10" y="6" width="1" height="1"/><rect x="12" y="6" width="1" height="1"/><rect x="14" y="6" width="1" height="1"/>
        <rect x="7" y="7" width="1" height="1"/><rect x="9" y="7" width="7" height="1"/><rect x="17" y="7" width="1" height="1"/>
        <rect x="8" y="8" width="9" height="1"/>
        <rect x="9" y="9" width="7" height="1"/>
        <rect x="8" y="10" width="9" height="1"/>
        <rect x="7" y="11" width="1" height="1"/><rect x="9" y="11" width="7" height="1"/><rect x="17" y="11" width="1" height="1"/>
        <rect x="10" y="12" width="5" height="1"/>
    </g>
    <g fill="#fff">
        <rect x="11" y="6" width="1" height="1"/><rect x="13" y="6" width="1" height="1"/>
    </g>

    <!-- The pipe it's climbing out of -->
    <rect x="5" y="13" width="15" height="3" fill="#2db84b"/>
    <rect x="5" y="13" width="1" height="3" fill="#13692a"/>
    <rect x="7" y="13" width="2" height="3" fill="#7ee08c"/>
    <rect x="19" y="13" width="1" height="3" fill="#13692a"/>
    <rect x="6" y="16" width="13" height="9" fill="#2db84b"/>
    <rect x="6" y="16" width="1" height="9" fill="#13692a"/>
    <rect x="8" y="16" width="2" height="9" fill="#7ee08c"/>
    <rect x="18" y="16" width="1" height="9" fill="#13692a"/>
    <rect x="6" y="16" width="13" height="1" fill="#13692a"/>
</svg>
