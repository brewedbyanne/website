<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <!-- Sized like an app: no pinch-zoom or double-tap zoom getting in the way of little fingers -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

    <!-- "Add to Home Screen" on an iPad opens this full screen, like an app -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Make Way!">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7ec0ee">
    <link rel="manifest" href="make-way.webmanifest">
    <link rel="apple-touch-icon" href="resources/img/make-way-icon-180.png">
    <link rel="icon" type="image/png" href="resources/img/make-way-icon-180.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="resources/css/make-way.css">

    <title>Make Way!</title>
</head>

<body>
    <!-- Everything inside is built by resources/js/make-way.js -->
    <div id="make-way" class="make-way">
        <noscript>Make Way! needs JavaScript to play.</noscript>
    </div>

    <script src="resources/js/make-way.js"></script>
</body>

</html>
